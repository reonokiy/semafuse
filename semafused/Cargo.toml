[package]
name = "semafused"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Foreground local service daemon for semafuse"
publish = false

[features]
default = []
# Heavy model dependencies are deliberately opt-in. The daemon and protocol
# remain buildable without downloading a native runtime or model artifacts.
models-candle = [
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers",
    "dep:fastembed",
    "dep:hex",
    "dep:sha2",
    "dep:tokenizers",
]
models-mkl = [
    "models-candle",
    "candle-core/mkl",
    "candle-nn/mkl",
    "fastembed/mkl",
]

[dependencies]
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
rustix = { version = "1", features = ["process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semafuse = { path = "..", default-features = false }
thiserror = "2"
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Keep these versions aligned. FastEmbed 5.17.3 uses Candle 0.11 and
# tokenizers 0.22.2. The dependency is feature-gated because FastEmbed also
# pulls its ORT integration even when only its Candle Qwen3 model is used.
candle-core = { version = "=0.11.0", optional = true }
candle-nn = { version = "=0.11.0", optional = true }
candle-transformers = { version = "=0.11.0", optional = true }
fastembed = { version = "=5.17.3", default-features = false, features = ["qwen3", "ort-load-dynamic"], optional = true }
hex = { version = "0.4", optional = true }
sha2 = { version = "0.10", optional = true }
tokenizers = { version = "=0.22.2", default-features = false, features = ["onig"], optional = true }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "deny"
