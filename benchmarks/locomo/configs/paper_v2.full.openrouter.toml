# End-to-end development comparison: native/Semafuse outputs cover all 314
# questions; pinned imported source-ranking RAG outputs cover the 312 questions
# with retrieval evidence.
# LazyMem uses the full prompt-only public-reproduction sampling profile. The
# public endpoint substitutions and official token-F1 evaluator mean this is
# not the binary-LJ score reported in the LazyMem paper.
schema_version = 1
name = "LoCoMo paper-v2 full prompt-only LazyMem development"
baseline_method = "bm25_top50"

[answerer]
expected_provider = "CoreWeave"
temperature = 0.0
top_p = 1.0
max_tokens = 512
enable_thinking = false

[answerer.endpoint]
base_url = "https://openrouter.ai/api/v1"
model = "qwen/qwen3-30b-a3b-instruct-2507"
api_key_env = "OPENROUTER_API_KEY"
thinking_control = "no_control"
timeout_secs = 180
max_retries = 2

[answerer.endpoint.extra_body.provider]
order = ["CoreWeave"]
allow_fallbacks = false
require_parameters = true
data_collection = "deny"
max_price = { prompt = 0.11, completion = 0.31 }

[pricing]
input_usd_per_million = 0.11
output_usd_per_million = 0.31
max_reported_usage_usd = 2.50

[[methods]]
kind = "bm25"
id = "bm25_top50"
limit = 50

[[methods]]
kind = "semafuse"
id = "lazymem_prompt_only"
config = "../../lazymem/configs/semafuse_lazymem.openrouter-full.toml"
limit = 50
stages = ["retrieved"]

[[imported_rankings]]
id = "mem0_oss_raw_source_ranking_rag"
source_method = "mem0_oss_raw"
journal = "../results/mem0-openrouter-v2/per-question.jsonl"
journal_sha256 = "e24168622d7962c5ade065976364f5241c3ec7da3eb7179ff172ba2378435673"
summary = "../results/mem0-openrouter-v2/summary.json"
summary_sha256 = "65eab82d9c5e7364d99d7ad25b782897c00f043585b253ef4d9f244c9cf68b6f"
source_run_key = "67799c9fe3e34c2814d467a90404c224404d7c37aebb5cac2bdfd5d56671dee9"
limit = 50
cohort = "retrieval_eligible"

[[imported_rankings]]
