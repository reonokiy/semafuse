schema_version = 1
name = "longmemeval-full-qa-example"
retrieval_profile = "all_role_message"
baseline_method = "bm25-lazymem"

[[methods]]
kind = "no_memory"
id = "no-memory"

[[methods]]
kind = "bm25"
id = "bm25-lazymem"
limit = 50

[[methods]]
kind = "recent"
id = "recent-50"
limit = 50

[[methods]]
kind = "strategy"
id = "semafuse"
config = "../../lazymem/configs/semafuse_lazymem.product.toml"
limit = 50
expose_stages = ["dense", "bm25", "rrf", "retrieved"]
stage_context_limit = 50

[[methods]]
kind = "oracle_turn"
id = "oracle-turn"

[[methods]]
kind = "oracle_session"
id = "oracle-session"

# Freeze the same answerer across every method. Credentials are resolved only
# from the named environment variable and are never written to artifacts.
[answerer]
temperature = 0.0
top_p = 1.0
max_tokens = 512
enable_thinking = true

[answerer.endpoint]
base_url = "https://openrouter.ai/api/v1"
model = "REPLACE_WITH_FROZEN_ANSWER_MODEL"
api_key_env = "OPENROUTER_API_KEY"
timeout_secs = 180
max_retries = 2

# The official LJ prompt/rule is frozen in Rust; the judge model remains an
# explicit experiment choice and must be held constant across methods.
[judge]
temperature = 0.0
top_p = 1.0
max_tokens = 10
enable_thinking = false

[judge.endpoint]
base_url = "https://openrouter.ai/api/v1"
model = "REPLACE_WITH_FROZEN_JUDGE_MODEL"
api_key_env = "OPENROUTER_API_KEY"
timeout_secs = 180
max_retries = 2
