# Semafuse's actual LazyMem strategy, configured for a local CPU smoke run.
#
# This uses a smaller embedding model than the product/paper template and the
# locally installed Codex CLI for MPM construction. It verifies that the real
# Semafuse ingest/index/retrieval/window/processor path works end to end; it is
# not a paper-comparable accuracy or latency configuration.

[strategies]
enabled = ["lazymem"]
recall = "lazymem"

[strategies.settings.lazymem]
protocol = "custom"
embedding_batch_size = 8

[strategies.settings.lazymem.embedding]
backend = "openai_compatible"

[strategies.settings.lazymem.embedding.endpoint]
base_url = "http://127.0.0.1:8001/v1"
model = "Qwen/Qwen3-Embedding-0.6B"
timeout_secs = 300
max_retries = 0

[strategies.settings.lazymem.reranker]
backend = "openai_compatible"

[strategies.settings.lazymem.reranker.endpoint]
base_url = "http://127.0.0.1:8002"
model = "BAAI/bge-reranker-v2-m3"
protocol = "tei"
timeout_secs = 300
max_retries = 0

[strategies.settings.lazymem.processor]
backend = "codex_cli"
model = "gpt-5.6-sol"
command = "codex"
timeout_secs = 600
max_output_bytes = 1048576

[strategies.settings.lazymem.retrieval]
dense_limit = 100
sparse_limit = 100
fused_limit = 100
rerank_top_n = 50
require_dense_index = true

[strategies.settings.lazymem.window]
radius = 2
merge_rule = "repository_contiguous"
max_messages = 8
stride = 7

[strategies.settings.lazymem.generation]
# Codex CLI calls are intentionally serial for the local smoke run.
max_concurrency = 1
