# Training-free closed-loop retrieval inspired by MemR3's evidence-gap and
# seen-mask design. This is a Semafuse implementation, not a claim of exact
# reproduction of another repository.
[strategies]
enabled = ["reconstructive"]
recall = "reconstructive"

[strategies.settings.reconstructive]
embedding_batch_size = 256

[strategies.settings.reconstructive.embedding]
backend = "openai_compatible"

[strategies.settings.reconstructive.embedding.endpoint]
base_url = "https://openrouter.ai/api/v1"
model = "perplexity/pplx-embed-v1-0.6b"
api_key_env = "OPENROUTER_API_KEY"
timeout_secs = 180
max_retries = 2

[strategies.settings.reconstructive.embedding.endpoint.extra_body.provider]
only = ["perplexity"]
allow_fallbacks = false
data_collection = "deny"

[strategies.settings.reconstructive.reranker]
backend = "openai_compatible"

[strategies.settings.reconstructive.reranker.endpoint]
base_url = "https://openrouter.ai/api/v1"
model = "voyageai/rerank-2.5"
api_key_env = "OPENROUTER_API_KEY"
protocol = "openrouter"
timeout_secs = 180
max_retries = 2

[strategies.settings.reconstructive.reranker.endpoint.extra_body.provider]
allow_fallbacks = false
data_collection = "deny"

[strategies.settings.reconstructive.controller]
kind = "evidence_gap"
hits_per_round = 5
max_rounds = 5
confidence_threshold = 0.8

[strategies.settings.reconstructive.controller.backend]
backend = "openai_compatible"

[strategies.settings.reconstructive.controller.backend.endpoint]
base_url = "https://openrouter.ai/api/v1"
model = "qwen/qwen3-32b"
api_key_env = "OPENROUTER_API_KEY"
thinking_control = "qwen_soft_switch"
timeout_secs = 180
max_retries = 2

[strategies.settings.reconstructive.controller.backend.endpoint.extra_body.reasoning]
enabled = false

[strategies.settings.reconstructive.controller.backend.endpoint.extra_body.provider]
order = ["DeepInfra"]
allow_fallbacks = false
require_parameters = true
data_collection = "deny"
max_price = { prompt = 0.11, completion = 0.31 }

[strategies.settings.reconstructive.controller.generation]
temperature = 0.0
top_p = 1.0
max_tokens = 768
enable_thinking = false
validation_retries = 2

[strategies.settings.reconstructive.retrieval]
dense_limit = 100
sparse_limit = 100
fused_limit = 100
require_dense_index = true

[strategies.settings.reconstructive.context]
neighbor_before = 1
neighbor_after = 2
max_events = 100
max_context_chars = 32768
max_controller_chars = 24576
