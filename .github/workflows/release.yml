name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Run quality checks
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Match tag to Cargo package version
        shell: bash
        run: |
          crate_version="$(awk -F '"' '/^version = "/ { print $2; exit }' Cargo.toml)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$tag_version" != "$crate_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match the Semafuse package version ($crate_version)" >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs:
      - quality
      - validate-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - runner: macos-15
            target: aarch64-apple-darwin
            archive: tar.gz
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        shell: bash
        run: |
          rustup target add "${{ matrix.target }}"
          rustc --version --verbose
      - name: Build semafuse release binary
        shell: bash
        run: cargo build --locked --release --target "${{ matrix.target }}" -p semafuse --bin semafuse
      - name: Build semafused release binary
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: cargo build --locked --release --target "${{ matrix.target }}" -p semafuse --bin semafused --no-default-features --features models-candle
      - name: Smoke-test semafuse
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/semafuse"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            binary="${binary}.exe"
          fi
          "$binary" --version
      - name: Smoke-test semafused
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: target/${{ matrix.target }}/release/semafused --version
      - name: Package Unix binary
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          archive="semafuse-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz"
          staging="target/release-package"
          mkdir -p dist "$staging"
          cp "target/${{ matrix.target }}/release/semafuse" "$staging/"
          cp "target/${{ matrix.target }}/release/semafused" "$staging/"
          cp semafused.example.toml "$staging/"
          cp LICENSE "$staging/"
          tar -C "$staging" -czf "dist/$archive" semafuse semafused semafused.example.toml LICENSE
      - name: Package Windows binary
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $archive = "semafuse-$env:GITHUB_REF_NAME-${{ matrix.target }}.zip"
          $staging = "target\release-package"
          New-Item -ItemType Directory -Force dist | Out-Null
          New-Item -ItemType Directory -Force $staging | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\semafuse.exe" $staging
          Copy-Item LICENSE $staging
          Compress-Archive -Path "$staging\*" -DestinationPath "dist\$archive"
      - name: Upload packaged binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packaged binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd dist
          sha256sum semafuse-* > SHA256SUMS.txt
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "Semafuse $GITHUB_REF_NAME"
          fi
