name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report Rust toolchain
        run: rustc --version --verbose
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Run models-candle Clippy
        run: cargo clippy --locked -p semafused --all-targets --features models-candle -- -D warnings
      - name: Run tests
        run: cargo test --locked --workspace --all-targets
      - name: Run models-candle tests
        run: cargo test --locked -p semafused --all-targets --features models-candle
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps
      - name: Build models-candle documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked -p semafused --no-deps --features models-candle

  rust-platforms:
    name: Rust (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            package_args: --workspace
            test_models_candle: true
          - runner: windows-2025
            package_args: -p semafuse
            test_models_candle: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report Rust toolchain
        run: rustc --version --verbose
      - name: Check all targets
        run: cargo check --locked --all-targets ${{ matrix.package_args }}
      - name: Run tests
        run: cargo test --locked --all-targets ${{ matrix.package_args }}
      - name: Check models-candle daemon
        if: matrix.test_models_candle
        run: cargo check --locked -p semafused --all-targets --features models-candle
      - name: Test models-candle daemon
        if: matrix.test_models_candle
        run: cargo test --locked -p semafused --all-targets --features models-candle

  web:
    name: Web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11.13.1
          package_json_file: web/package.json
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check Astro project
        run: pnpm check
      - name: Build site
        run: pnpm build
