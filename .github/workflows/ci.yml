name: CI

on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify release target policy alignment
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import tomllib

          release_matrix = json.loads(Path(".github/release-targets.json").read_text())
          expected = [entry["target"] for entry in release_matrix["include"]]
          policies = {
              "about.toml": tomllib.loads(Path("about.toml").read_text())["targets"],
              "deny.toml": tomllib.loads(Path("deny.toml").read_text())["graph"]["targets"],
          }
          for name, actual in policies.items():
              if actual != expected:
                  raise SystemExit(f"{name} targets differ from .github/release-targets.json")
          PY
      - name: Validate release metadata contract
        shell: bash
        run: |
          metadata="$(bash scripts/release-metadata.sh)"
          jq -e '
            . as $metadata |
            ($metadata.version | type) == "string" and
            $metadata.version != "" and
            $metadata.tag == ("v" + $metadata.version) and
            ($metadata.assets | length) == 5 and
            all($metadata.assets[]; startswith("semafuse-" + $metadata.tag + "-"))
          ' <<< "$metadata" >/dev/null
      - name: Lint GitHub Actions workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        shell: bash
        run: |
          tool_dir="$(mktemp -d)"
          trap 'rm -r "$tool_dir"' EXIT
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}" \
            --output "$tool_dir/$archive"
          echo "$ACTIONLINT_SHA256  $tool_dir/$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$tool_dir/$archive" --directory "$tool_dir" actionlint
          # actionlint 1.7.12 predates GitHub's supported `concurrency.queue`
          # key. Keep the exception exact so every other syntax error remains
          # fatal until actionlint's schema catches up.
          queue_key_count="$(grep -hEc '^[[:space:]]+queue:' .github/workflows/*.yml \
            | awk '{ total += $1 } END { print total + 0 }')"
          [[ "$queue_key_count" -eq 1 ]]
          grep -Fqx '  queue: max' .github/workflows/release.yml
          "$tool_dir/actionlint" -color \
            -ignore 'unexpected key "queue" for "concurrency" section' \
            .github/workflows/*.yml
      - name: Check advisories, licenses, and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: 1.97.1
          command: check advisories licenses sources
          arguments: --locked --features models-candle
      - name: Verify third-party notices are current
        env:
          CARGO_ABOUT_VERSION: 0.9.1
          CARGO_ABOUT_SHA256: c0e7dc6f5d74b0beec5c0053d39ab24514c717d19acd91886907a22457ea9e98
        shell: bash
        run: |
          tool_dir="$(mktemp -d)"
          trap 'rm -r "$tool_dir"' EXIT
          archive="cargo-about-${CARGO_ABOUT_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            "https://github.com/EmbarkStudios/cargo-about/releases/download/${CARGO_ABOUT_VERSION}/${archive}" \
            --output "$tool_dir/$archive"
          echo "$CARGO_ABOUT_SHA256  $tool_dir/$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$tool_dir/$archive" --directory "$tool_dir"
          "$tool_dir/cargo-about-${CARGO_ABOUT_VERSION}-x86_64-unknown-linux-musl/cargo-about" \
            generate --locked --fail --features models-candle about.hbs \
            --output-file "$tool_dir/THIRD_PARTY_NOTICES.html"
          cmp THIRD_PARTY_NOTICES.html "$tool_dir/THIRD_PARTY_NOTICES.html"

  rust:
    name: Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report Rust toolchain
        run: rustc --version --verbose
      - name: Install benchmark Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          key: linux-quality
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run daemon Clippy
        run: cargo clippy --locked --all-targets --no-default-features --features daemon -- -D warnings
      - name: Run benchmark Clippy
        run: cargo clippy --locked --all-targets --features benchmarks -- -D warnings
      - name: Run models-candle Clippy
        run: cargo clippy --locked --all-targets --features models-candle -- -D warnings
      - name: Run tests
        run: cargo test --locked --all-targets
      - name: Run benchmark tests
        run: cargo test --locked --all-targets --features benchmarks
      - name: Run daemon tests
        run: cargo test --locked --all-targets --features daemon
      - name: Run models-candle tests
        run: cargo test --locked --lib --features models-candle
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps
      - name: Build benchmark documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --features benchmarks
      - name: Build models-candle documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --features models-candle

  rust-platforms:
    name: Rust (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            test_models_candle: true
          - runner: windows-2025
            test_models_candle: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report Rust toolchain
        run: rustc --version --verbose
      - name: Install benchmark Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          key: platform-${{ matrix.runner }}
      - name: Check all targets
        run: cargo check --locked --all-targets
      - name: Run tests
        run: cargo test --locked --all-targets
      - name: Check benchmark targets
        run: cargo check --locked --all-targets --features benchmarks
      - name: Run benchmark tests
        run: cargo test --locked --all-targets --features benchmarks
      - name: Check daemon
        if: matrix.test_models_candle
        run: cargo check --locked --all-targets --no-default-features --features daemon
      - name: Test daemon
        if: matrix.test_models_candle
        run: cargo test --locked --all-targets --features daemon
      - name: Check models-candle daemon
        if: matrix.test_models_candle
        run: cargo check --locked --all-targets --features models-candle
      - name: Test models-candle daemon
        if: matrix.test_models_candle
        run: cargo test --locked --lib --features models-candle

  benchmark-harnesses:
    name: Benchmark harnesses
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install benchmark test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          --requirement benchmarks/external_memory/requirements.test.lock.txt
      - name: Test external-memory harness
        env:
          PYTHONPATH: benchmarks/external_memory/src
        run: python -m unittest discover -s benchmarks/external_memory/tests -p 'test_*.py'
      - name: Test LazyMem harness
        env:
          PYTHONPATH: benchmarks/lazymem/src
        run: python -m unittest discover -s benchmarks/lazymem/tests -p 'test_*.py'
      - name: Test LoCoMo receipt tools
        run: python -m unittest discover -s benchmarks/locomo/tests -p 'test_*.py'
      - name: Test LMEB harness
        env:
          PYTHONPATH: benchmarks/lmeb
        run: python -m unittest discover -s benchmarks/lmeb/tests -p 'test_*.py'
      - name: Test MemoryAgentBench harness
        env:
          PYTHONPATH: benchmarks/memoryagentbench/src
        run: python -m unittest discover -s benchmarks/memoryagentbench/tests -p 'test_*.py'

  web:
    name: Web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0
          package_json_file: web/package.json
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check Astro project
        run: pnpm check
      - name: Build site
        run: pnpm build
