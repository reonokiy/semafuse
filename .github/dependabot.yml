version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 10
    groups:
      candle-stack:
        patterns:
          - candle-*
          - fastembed
          - tokenizers
      rust-minor-and-patch:
        patterns:
          - "*"
        exclude-patterns:
          - candle-*
          - fastembed
          - tokenizers
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      web-dependencies:
        patterns:
          - "*"

  - package-ecosystem: pip
    directories:
      - /benchmarks/external_memory
      - /benchmarks/external_memory/methods/amem
      - /benchmarks/external_memory/methods/amem_paper
      - /benchmarks/external_memory/methods/mem0_oss
      - /benchmarks/lazymem
      - /benchmarks/lmeb
      - /benchmarks/memoryagentbench
    schedule:
      interval: weekly
      day: monday
      time: "06:20"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      python-benchmark-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
