accepted = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]

# Match the five targets built by the release workflow. The notice is generated
# with `--features models-candle`, which is the union of the default `semafuse`
# build and the `semafused --no-default-features --features models-candle` build.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

ignore-build-dependencies = false
ignore-dev-dependencies = true

[private]
ignore = true
